<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>猜猜我</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<main id="app">
  <section id="screen-home" class="screen">
    <h1>猜猜我</h1>
    <p class="tagline">随机抽题，各自选答案，再猜对方。</p>
    <div class="flowcard" aria-label="玩法流程">
      <p>1. 系统随机给你 5 道题，先选出“你自己的答案”</p>
      <p>2. 发链接给对方，对方猜你的答案</p>
      <p>3. 对方再回答 5 道自己的题，你来猜</p>
      <p>4. 双方结果当场揭晓</p>
    </div>
    <button id="btn-start" class="btn btn-primary">开始游戏</button>
    <p class="privacy-note">游戏程序不会把答案上传到服务器。</p>
  </section>
  <section id="screen-answer" class="screen hidden">
    <h2 id="answer-title">回答问题</h2>
    <p class="hint" id="answer-sub"></p>
    <div id="answer-form"></div>
    <div id="answer-error" class="inline-error" role="alert"></div>
    <button id="btn-submit-answers" class="btn btn-primary" disabled>提交</button>
  </section>
  <section id="screen-share" class="screen hidden">
    <h2 id="share-title">分享链接</h2>
    <p class="hint" id="share-sub"></p>
    <textarea id="share-url" class="share-url" rows="3" readonly aria-label="游戏链接"></textarea>
    <div class="btn-row">
      <button id="btn-native-share" class="btn btn-primary hidden">分享</button>
      <button id="btn-copy" class="btn btn-secondary">复制链接</button>
    </div>
    <p id="copy-feedback" class="hint" aria-live="polite"></p>
    <p class="privacy-note">链接包含题目和答案；懂技术的人可以解码直接看到。Base64URL 只是编码，不是加密。请只把链接发给你想一起玩的人。</p>
    <button id="btn-restart-from-share" class="btn btn-text">重新开始</button>
  </section>
  <section id="screen-result" class="screen hidden">
    <h2>结果揭晓</h2>
    <div class="score-row">
      <div class="scorecard"><p class="score-label" id="score-a-label">TA 猜中你的答案</p><p class="score-num" id="score-a">–/5</p></div>
      <div class="scorecard"><p class="score-label" id="score-b-label">你猜中 TA 的答案</p><p class="score-num" id="score-b">–/5</p></div>
    </div>
    <button id="btn-detail-toggle" class="btn btn-text">逐题对照 ▾</button>
    <div id="result-detail" class="hidden"></div>
    <button id="btn-home-from-result" class="btn btn-primary">再玩一局</button>
  </section>
  <section id="screen-error" class="screen hidden">
    <h2>⚠️</h2>
    <p class="error-main">这个链接无效或已经损坏。</p>
    <p class="hint">如果链接被截断，请让对方重新发送完整链接。</p>
    <p class="hint" id="error-code" aria-hidden="true"></p>
    <button id="btn-home-from-error" class="btn btn-primary">返回首页</button>
  </section>
</main>
<script src="question-bank.js?v=3"></script>
<script src="app.js?v=3"></script>
</body>
</html>
